# Postgres local para desarrollo — no se usó en esta sesión (sin Docker disponible en el
# entorno del agente), pero deja listo `docker compose up -d` para correr las migraciones y
# probar RLS de verdad en cuanto tengas Docker a la mano.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sba
      POSTGRES_PASSWORD: sba_dev_password
      POSTGRES_DB: sba_sports_os
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
